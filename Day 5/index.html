<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello</title>
</head>

<body>
    <h1>My website</h1>
    <h2>form to apply fot sigma web development course</h2>
    <form action="post">
        <div>
            <label for="username">Enter Your Username:</label>
            <input type="text" id="username" name="username" placeholder="Enter Your username">
        </div>
        <div>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">female</label>
        </div>
        <div>
            <input type="checkbox" id="subscribe" name="subscribe" value="yes">
            <label for="subscribe">Subscribe to the newsletter</label>
        </div>
        <div>
            <label for="comment">Enter your comment here</label> <br>
            <textarea name="comment" rows="4" cols="25"></textarea>
        </div>

        <div>
            <select name="fruits" id="">
                <option value="apple">apple</option>
                <option value="mango">mango</option>
                <option value="berry">berry</option>

            </select>
        </div>
    </form>
</body>

</html>
